<!--#region head-->
<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="stylesheet" href="style.css">
    <title>The Met</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <!-- #endregion -->
  <body class="page__body">
    <header class="header">
      <div class="header__top">
        <a href="#">
          <img src="images/logo.png" alt="The Met Logo">
        </a>
        <div class="header__icons">
          <a href="#" class="icon icon--phone"></a>
          <a href="#menu" class="icon icon--menu"></a>
        </div>
      </div>
      <div class="header__bottom">
        <h1 class="header__title">Welcome <br> to The MET</h1>
      </div>
    </header>

    <aside class="page__menu menu" id="menu">
      <div class="menu__top">
        <a href="#">
          <img src="images/logo.png" alt="The Met Logo">
        </a>
        <a href="#" class="icon icon--close"></a>
      </div>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a href="#home" class="nav__link">Home</a>
          </li>

          <li class="nav__item">
            <a href="#about-us" class="nav__link">About Us</a>
          </li>

          <li class="nav__item">
            <a href="#now-on-view" class="nav__link">Now on view</a>
          </li>

          <li class="nav__item">
            <a href="#explore-online" class="nav__link">Explore Online</a>
          </li>

          <li class="nav__item">
            <a href="#contacts" class="nav__link">Contacts</a>
          </li>
        </ul>
        <div class="contacts">
          <div class="contacts__number">
            <h2 class="number__title">The Met Fifth Avenue</h2>
            <a href="#tel:+1 212-535-7710" class="phone__number">+1 212-535-7710</a>
          </div>
          <div class="contacts__number">
            <h2 class="number__title">The Met Cloisters</h2>
            <a href="#tel:+1 212-923-3700" class="phone__number">+1 212-923-3700</a>
          </div>
          <a href="#" class="call-to-order">Call to order</a>
        </div>
      </nav>

    </aside>

    <main class="main">
      <section class="museum-hours">
        <h2>Museum hours</h2>
      </section>

      <section class="now-on-view">
        <h2>Now On View</h2>
      </section>

      <section class="more-to-explore">
        <h2>More to Explore Online</h2>
      </section>

      <section class="contact-us">
        <h2>Contact us</h2>
      </section>
    </main>

    <footer></footer>

  </body>
</html>
